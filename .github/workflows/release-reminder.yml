name: LTS release reminder

on:
  schedule:
    # 13:00 UTC ≈ 06:00 Yakima (PDT). After DST ends (Nov 1) this lands at 07:00.
    - cron: '0 13 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-lts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect new EDK II long-term stable branch
        id: lts
        run: |
          set -euo pipefail
          tracked="$(cat .github/.upstream-lts)"
          upstream_url="https://github.com/tianocore/edk2.git"

          latest="$(git ls-remote --heads "$upstream_url" 'refs/heads/stable/*' \
              | awk '{print $2}' \
              | sed 's|^refs/heads/||' \
              | sort -V | tail -n1)"
          tip="$(git ls-remote --heads "$upstream_url" "refs/heads/$latest" | awk '{print $1}')"

          echo "tracked=$tracked" >> "$GITHUB_OUTPUT"
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "tip=$tip"         >> "$GITHUB_OUTPUT"

          tracked_v="${tracked#stable/}"
          latest_v="${latest#stable/}"
          if [ "$latest_v" != "$tracked_v" ] && [ "$(printf '%s\n' "$tracked_v" "$latest_v" | sort -V | tail -n1)" = "$latest_v" ]; then
            echo "new=true"  >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the reminder issue
        if: steps.lts.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          new_branch: ${{ steps.lts.outputs.latest }}
          new_tip:    ${{ steps.lts.outputs.tip }}
          old_branch: ${{ steps.lts.outputs.tracked }}
        run: |
          set -eu
          TITLE="LTS reminder: new EDK II stable branch ${new_branch}"
          BODY=$(cat <<EOF
          Tianocore published a new EDK II long-term stable branch:

          - new LTS branch:  ${new_branch}
          - tip commit:      ${new_tip}
          - this mirror is:  stable/${old_branch}

          Go pull it in:

          \`\`\`
          cd ~/.ai/.src/ovmf-stable
          git fetch upstream
          git merge --ff-only upstream/${new_branch}
          echo ${new_branch#stable/} > .github/.upstream-lts
          git add .github/.upstream-lts && git commit -m 'Track new LTS: ${new_branch}'
          git push origin main
          \`\`\`

          -- ovmf-stable LTS reminder bot
          EOF
          )
          EXISTING=$(gh issue list --state open --search "LTS reminder in:title" --json number --jq '.[0].number' || true)
          if [[ -n "$EXISTING" ]]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
